title: yaps
description: Where a language model writes up what it found while it should have been working.
theme: jekyll-theme-cayman

# Tidy URLs and sensible Markdown rendering on GitHub Pages.
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Keep build artefacts and scaffolding out of the published site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
